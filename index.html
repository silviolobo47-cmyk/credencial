<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Credenciales</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5fd1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="jszip.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d9dde3;--pr:#1d5fd1;--prt:#fff;--dg:#c0392b;--ok:#1e8e4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mu:#9aa4b2;--bd:#323943;--pr:#4b8bf5;--prt:#fff;--dg:#ff6b5c;--ok:#4cc380}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#eceff3;--mu:#9aa4b2;--bd:#323943;--pr:#4b8bf5;--prt:#fff;--dg:#ff6b5c;--ok:#4cc380}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.photo{width:120px;height:160px;margin:0 auto 12px;border:2px dashed var(--bd);border-radius:10px;background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;text-align:center}
.row{display:flex;gap:8px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:12px;min-height:48px;flex:1}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr);font-weight:600}
button.s{flex:0 0 auto;min-height:40px;padding:8px 12px}
button.d{color:var(--dg)}
button:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 4px}
input[type=text]{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:12px}
input[type=file]{display:none}
.msg{min-height:20px;font-size:14px;margin:0 0 10px}
.err{color:var(--dg)}.ok{color:var(--ok)}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.item img{width:45px;height:60px;object-fit:cover;border-radius:6px;flex:none}
.item .t{flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{color:var(--mu);font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mu);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Credenciales</h1>

<div class="card">
  <div class="photo" id="prev">Sin foto</div>
  <div class="row">
    <button id="bCam" type="button">📷 Sacar foto</button>
    <button id="bGal" type="button">🖼️ Galería</button>
  </div>
  <input type="file" id="fCam" accept="image/*" capture="environment">
  <input type="file" id="fGal" accept="image/*">
  <label for="ape">Apellido</label>
  <input type="text" id="ape" autocomplete="off" autocapitalize="words">
  <label for="nom">Nombre</label>
  <input type="text" id="nom" autocomplete="off" autocapitalize="words">
  <label for="dni">DNI</label>
  <input type="text" id="dni" inputmode="numeric" autocomplete="off" maxlength="10">
  <p class="msg" id="msg"></p>
  <div class="row" style="margin:0">
    <button id="bSave" class="p" type="button">Guardar</button>
    <button id="bCancel" type="button" style="display:none">Cancelar</button>
  </div>
</div>

<div class="card">
  <div class="hd"><span id="cnt">0 / 1000</span></div>
  <button id="bDoc" class="p" type="button" style="width:100%">📄 Generar Word</button>
  <p class="msg" id="msg2" style="margin-top:10px"></p>
  <div id="list"></div>
</div>
</main>

<script>
(function(){
var MAX=1000, photo=null, editId=null, items=[], db=null;
var $=function(i){return document.getElementById(i)};

/* ---------- almacenamiento (IndexedDB, con respaldo en memoria) ---------- */
function openDb(){return new Promise(function(res){
  try{
    var r=indexedDB.open("credenciales",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("p",{keyPath:"id",autoIncrement:true})};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){res(null)};
  }catch(e){res(null)}
})}
function tx(mode){return db.transaction("p",mode).objectStore("p")}
function req(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
var memId=1;
async function loadAll(){
  if(!db)return items;
  try{return await req(tx("readonly").getAll())}catch(e){return items}
}
async function put(o){
  if(!db){if(!o.id)o.id=memId++;return o}
  try{var id=await req(tx("readwrite").put(o));o.id=id;return o}catch(e){if(!o.id)o.id=memId++;return o}
}
async function del(id){
  if(!db)return;
  try{await req(tx("readwrite").delete(id))}catch(e){}
}

/* ---------- foto: recorte 3:4 y reducción ---------- */
function procFile(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file), im=new Image();
  im.onload=function(){
    var W=360,H=480,c=document.createElement("canvas");c.width=W;c.height=H;
    var g=c.getContext("2d"),s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;
    g.fillStyle="#fff";g.fillRect(0,0,W,H);
    g.drawImage(im,(W-w)/2,(H-h)/2,w,h);
    URL.revokeObjectURL(url);
    res(c.toDataURL("image/jpeg",0.85));
  };
  im.onerror=function(){URL.revokeObjectURL(url);rej()};
  im.src=url;
})}
async function onFile(e){
  var f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  try{photo=await procFile(f);showPhoto();say("");}
  catch(x){say("No se pudo leer la foto.",1)}
}
function showPhoto(){
  var p=$("prev");
  if(photo){p.style.backgroundImage="url("+photo+")";p.textContent=""}
  else{p.style.backgroundImage="";p.textContent="Sin foto"}
}

/* ---------- formulario ---------- */
function say(t,err,id){var m=$(id||"msg");m.textContent=t;m.className="msg "+(t?(err?"err":"ok"):"")}
function clean(s){return s.replace(/\s+/g," ").trim()}
function resetForm(){
  photo=null;editId=null;$("ape").value="";$("nom").value="";$("dni").value="";
  $("bSave").textContent="Guardar";$("bCancel").style.display="none";showPhoto();
}
async function save(){
  var ape=clean($("ape").value),nom=clean($("nom").value),dni=$("dni").value.replace(/\D/g,"");
  if(!photo)return say("Falta la foto.",1);
  if(!ape||!nom)return say("Completá apellido y nombre.",1);
  if(dni.length<6)return say("El DNI no parece válido.",1);
  if(items.some(function(i){return i.dni===dni&&i.id!==editId}))return say("Ese DNI ya está cargado.",1);
  if(editId==null&&items.length>=MAX)return say("Llegaste al tope de "+MAX+".",1);
  var o={apellido:ape,nombre:nom,dni:dni,foto:photo};
  if(editId!=null)o.id=editId;
  await put(o);
  items=await loadAll();
  resetForm();render();say("Guardado ✓",0);
  window.scrollTo({top:0,behavior:"smooth"});
}
function edit(id){
  var o=items.find(function(i){return i.id===id});if(!o)return;
  editId=id;photo=o.foto;showPhoto();
  $("ape").value=o.apellido;$("nom").value=o.nombre;$("dni").value=o.dni;
  $("bSave").textContent="Guardar cambios";$("bCancel").style.display="";
  say("Editando…",0);window.scrollTo({top:0,behavior:"smooth"});
}
var pendingDel=null;
async function remove(id,btn){
  if(pendingDel!==id){pendingDel=id;btn.textContent="¿Seguro?";setTimeout(function(){if(pendingDel===id){pendingDel=null;btn.textContent="Borrar"}},3000);return}
  pendingDel=null;await del(id);
  items=items.filter(function(i){return i.id!==id});
  if(editId===id)resetForm();render();
}
function render(){
  items.sort(function(a,b){return (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre,"es")});
  $("cnt").textContent=items.length+" / "+MAX;
  var l=$("list");l.textContent="";
  items.forEach(function(o){
    var d=document.createElement("div");d.className="item";
    var im=document.createElement("img");im.src=o.foto;im.alt="";
    var t=document.createElement("div");t.className="t";
    var b=document.createElement("b");b.textContent=o.apellido+", "+o.nombre;
    var s=document.createElement("span");s.textContent="DNI "+o.dni;
    t.appendChild(b);t.appendChild(s);
    var be=document.createElement("button");be.className="s";be.textContent="Editar";be.onclick=function(){edit(o.id)};
    var bd=document.createElement("button");bd.className="s d";bd.textContent="Borrar";bd.onclick=function(){remove(o.id,bd)};
    d.appendChild(im);d.appendChild(t);d.appendChild(be);d.appendChild(bd);l.appendChild(d);
  });
}

/* ---------- Word (.docx) ---------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function b64bytes(u){var b=atob(u.split(",")[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function run(t,sz,bold){return '<w:r><w:rPr>'+(bold?'<w:b/>':'')+'<w:sz w:val="'+sz+'"/></w:rPr><w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>'}
function para(inner,after){return '<w:p><w:pPr><w:spacing w:before="0" w:after="'+after+'"/><w:jc w:val="center"/></w:pPr>'+inner+'</w:p>'}
function pic(n){
  var cx=1080000,cy=1440000;
  return '<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="'+cx+'" cy="'+cy+'"/><wp:docPr id="'+n+'" name="Foto '+n+'"/>'+
  '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'+
  '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="'+n+'" name="foto'+n+'.jpg"/><pic:cNvPicPr/></pic:nvPicPr>'+
  '<pic:blipFill><a:blip r:embed="rId'+(n+10)+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'+
  '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>'+
  '</a:graphicData></a:graphic></wp:inline></w:drawing></w:r>';
}
function cell(o,n){
  var body=o?para(pic(n),80)+para(run(o.apellido.toUpperCase()+", "+o.nombre,26,1),20)+para(run("DNI: "+o.dni,24,0),0):'<w:p/>';
  return '<w:tc><w:tcPr><w:tcW w:w="5386" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>'+body+'</w:tc>';
}
async function makeDocx(){
  var zip=new JSZip(),rels="",rows="",i,n=0;
  for(i=0;i<items.length;i+=2){
    var a=items[i],b=items[i+1];
    var c1=cell(a,++n);zip.file("word/media/foto"+n+".jpg",b64bytes(a.foto));rels+='<Relationship Id="rId'+(n+10)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/foto'+n+'.jpg"/>';
    var c2="";
    if(b){c2=cell(b,++n);zip.file("word/media/foto"+n+".jpg",b64bytes(b.foto));rels+='<Relationship Id="rId'+(n+10)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/foto'+n+'.jpg"/>'}
    else c2=cell(null,0);
    rows+='<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="3600" w:hRule="atLeast"/></w:trPr>'+c1+c2+'</w:tr>';
  }
  var bd='<w:tblBorders>'+["top","left","bottom","right","insideH","insideV"].map(function(k){return '<w:'+k+' w:val="single" w:sz="6" w:space="0" w:color="888888"/>'}).join("")+'</w:tblBorders>';
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>'+
  '<w:tbl><w:tblPr><w:tblW w:w="10772" w:type="dxa"/>'+bd+'<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="100" w:type="dxa"/><w:bottom w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="5386"/><w:gridCol w:w="5386"/></w:tblGrid>'+rows+'</w:tbl>'+
  '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="567" w:right="567" w:bottom="567" w:left="567" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/_rels/document.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>');
  zip.file("word/document.xml",doc);
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
async function genDoc(){
  if(!items.length)return say("No hay credenciales cargadas.",1,"msg2");
  if(typeof JSZip==="undefined")return say("No cargó el generador. Revisá la conexión y recargá.",1,"msg2");
  var btn=$("bDoc");btn.disabled=true;say("Armando el Word…",0,"msg2");
  try{
    var blob=await makeDocx();
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="credenciales.docx";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},10000);
    say("Listo ✓ ("+items.length+" credenciales)",0,"msg2");
  }catch(e){
    say("No se pudo generar el archivo.",1,"msg2");
  }finally{btn.disabled=false}
}

/* ---------- eventos ---------- */
$("bCam").onclick=function(){$("fCam").click()};
$("bGal").onclick=function(){$("fGal").click()};
$("fCam").onchange=onFile;$("fGal").onchange=onFile;
$("bSave").onclick=save;
$("bCancel").onclick=function(){resetForm();say("")};
$("dni").oninput=function(){this.value=this.value.replace(/\D/g,"")};
$("bDoc").onclick=genDoc;
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
(async function(){db=await openDb();items=await loadAll();render()})();
})();
</script>
</body>
</html>
